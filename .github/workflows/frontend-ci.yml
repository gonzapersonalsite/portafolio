name: frontend-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck_and_lint:
    # Pinned image: ubuntu-latest moves to a new release on GitHub's schedule, not ours.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    # Actions are pinned to full commit SHAs (tags can be moved); the comment names the release.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # pnpm build is `tsc -b && vite build`: it type-checks the app, the tooling and the build
      # config, then bundles exactly as Vercel does.
      - name: Type-check and build
        run: pnpm build
